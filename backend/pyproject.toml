[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "safedocs-backend"
version = "0.1.0"
description = "SafeDocs API: privacy-first AI workspace for SMEs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.8",
    "httpx2>=2.16",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "vulture>=2.13",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# pytest relies on plain assert statements.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.vulture]
paths = ["app"]
min_confidence = 80

[tool.bandit]
exclude_dirs = ["tests"]
